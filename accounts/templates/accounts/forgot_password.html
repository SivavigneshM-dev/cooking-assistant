<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body {
            background-color: #fff5e6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .header-text { text-align: center; margin-bottom: 20px; color: #333; }
        .header-text h2 { margin: 0 0 5px 0; font-weight: 500; }
        .header-text p { margin: 0; color: #666; }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
        }

        .card h3 { margin-top: 0; margin-bottom: 5px; }
        .subtitle { color: #777; font-size: 0.9em; margin-bottom: 20px; display: block;}

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.95em; color: #000; }

        /* General Input Styling */
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%; 
            padding: 12px; 
            border: 1px solid #e0e0e0;
            background-color: #f4f6f8; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1em;
        }

        /* --- PASSWORD CONTAINER STYLING --- */
        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container input {
            width: 100%;
            padding-right: 45px; /* Space for the icon */
            box-sizing: border-box;
        }

        .toggle-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            z-index: 10;
            /* These two lines fix the jitter/movement */
            width: 24px; 
            text-align: center;
            user-select: none;
        }       
        /* ----------------------------------- */

        .captcha-box {
            background-color: #f0f2f5; border: 1px solid #dcdcdc;
            border-radius: 6px; padding: 15px; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.5em; letter-spacing: 2px; position: relative; margin-bottom: 10px;
        }

        .refresh-btn {
            position: absolute; right: 15px; background: white;
            border: 1px solid #ccc; border-radius: 4px; cursor: pointer;
            padding: 5px 10px; font-size: 0.6em;
        }

        .submit-btn {
            width: 100%; padding: 12px; background-color: #ff6600;
            color: white; border: none; border-radius: 6px;
            font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 10px;
        }
        .submit-btn:hover { background-color: #e65c00; }

        .back-link {
            display: block; text-align: center; margin-top: 20px;
            color: #ff6600; text-decoration: underline; font-size: 0.9em;
        }
        
        .messages {
            list-style: none; padding: 0; margin-bottom: 15px; text-align: center;
        }
        .messages li { color: red; font-size: 0.9em; }
        .messages li.success { color: green; }

        .refresh-btn {
        position: absolute; 
        right: 15px; 
        background: white;
        border: 1px solid #ccc; 
        border-radius: 4px; 
        cursor: pointer;
        padding: 5px 10px; 
        font-size: 1.2em; /* Made slightly bigger for clicking */
        color: black;
        display: flex; 
        align-items: center; 
        justify-content: center;
        transition: background 0.2s;
    }
    .refresh-btn:hover {
        background-color: #e6e6e6;
    }

    </style>
</head>
<body>

    <div class="header-text">
        <h2>Reset Your Password</h2>
        <p>Enter your details to reset your password</p>
    </div>

    <div class="card">
        <h3>Forgot Password</h3>
        <span class="subtitle">Complete the captcha and enter your new password</span>

        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label>Solve this problem to verify you're human</label>
                <div class="captcha-box">
                    <span id="num1">{{ num1 }}</span> + <span id="num2">{{ num2 }}</span> = ?
                    <button type="button" class="refresh-btn" onclick="refreshCaptcha()" title="Refresh Captcha">&#x21bb;</button>
                </div>
                <input type="number" name="captcha_answer" placeholder="Enter your answer" required>
            </div>

            <div class="form-group">
                <label>New Password</label>
                <div class="password-container">
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                    <i class="fa-solid fa-eye fa-fw toggle-icon" onclick="togglePassword('new_password', this)"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>
                <div class="password-container">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                    <i class="fa-solid fa-eye fa-fw toggle-icon" onclick="togglePassword('confirm_password', this)"></i>
                </div>
            </div>

            <button type="submit" class="submit-btn">Reset Password</button>
            
            <a href="{% url 'login' %}" class="back-link">Back to Login</a>
        </form>
    </div>

    <script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        }
    }

    function refreshCaptcha() {
        // USE THIS DJANGO TAG so it finds the correct link automatically
        fetch("{% url 'refresh_captcha' %}")
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            // Update the HTML text with new numbers
            document.getElementById('num1').innerText = data.num1;
            document.getElementById('num2').innerText = data.num2;
            
            // Clear the answer input field
            document.querySelector('input[name="captcha_answer"]').value = '';
        })
        .catch(error => console.error('Error refreshing captcha:', error));
    }
    </script>
    
    

</body>
</html>
